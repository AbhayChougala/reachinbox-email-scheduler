services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: ["elasticsearch_data:/usr/share/elasticsearch/data"]
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: .
    env_file: .env
    command: ["node", "apps/api/dist/server.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      elasticsearch: { condition: service_started }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["node", "apps/worker/dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      elasticsearch: { condition: service_started }
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    environment: { APP_DOMAIN: "${APP_DOMAIN}" }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  caddy_data:
  caddy_config:
